# Alternativa si tu proxy existente es nginx (el certificado lo maneja tu
# configuración actual, por ejemplo con certbot).
server {
    listen 443 ssl;
    http2 on;
    server_name multiparty.tu-dominio.com;

    # ssl_certificate     /etc/letsencrypt/live/multiparty.tu-dominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/multiparty.tu-dominio.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;  # importar y sincronizar pueden tardar
    }
}
